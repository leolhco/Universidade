<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Revista</title>
</head>
<body>
    <h1>revista</h1>

    <fieldset>
        <legend>Cadastrar</legend>
        <form action="revista" method="post">
            <input type="hidden" name="acao" value="cadastrar"/>
            Titulo: <input type="text" name="titulo"/><br/>
            Editora: <input type="text" name="editora"/><br/>
            Numero da edicao: <input type="number" name="numeroEdicao"/><br/>
            Ano de publicacao: <input type="number" name="anoPublicacao"/><br/>
            Mes de publicacao: <input type="text" name="mesPublicacao"/><br/>
            ISSN: <input type="text" name="issn"/><br/>
            Periodicidade: <input type="text" name="periodicidade"/><br/>
            <input type="submit" value="Cadastrar"/>
        </form>
    </fieldset>

    <fieldset>
        <legend>Alterar</legend>
        <form action="revista" method="post">
            <input type="hidden" name="acao" value="alterar"/>
            ID: <input type="number" name="id"/><br/>
            Titulo: <input type="text" name="titulo"/><br/>
            Editora: <input type="text" name="editora"/><br/>
            Numero da edicao: <input type="number" name="numeroEdicao"/><br/>
            Ano de publicacao: <input type="number" name="anoPublicacao"/><br/>
            Mes de publicacao: <input type="text" name="mesPublicacao"/><br/>
            ISSN: <input type="text" name="issn"/><br/>
            Periodicidade: <input type="text" name="periodicidade"/><br/>
            <input type="submit" value="Alterar"/>
        </form>
    </fieldset>

    <fieldset>
        <legend>Consultar</legend>
        <form action="revista" method="get">
            <input type="hidden" name="acao" value="consultar"/>
            ID: <input type="number" name="id"/><br/>
            <input type="submit" value="Consultar"/>
        </form>
    </fieldset>

    <fieldset>
        <legend>Remover</legend>
        <form action="revista" method="post">
            <input type="hidden" name="acao" value="remover"/>
            ID: <input type="number" name="id"/><br/>
            <input type="submit" value="Remover"/>
        </form>
    </fieldset>
</body>
</html>
